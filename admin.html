<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Rainy.solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #050a0f;
      --surface: #0b1520;
      --surface2: #0f1e2e;
      --border: #1a2d42;
      --accent: #4ab8ff;
      --accent2: #0077cc;
      --text: #d6eaf8;
      --muted: #4a7a9b;
      --error: #ff5566;
      --success: #44ffaa;
      --warn: #ffcc44;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
    }

    /* ── Login ── */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .login-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .login-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 28px; }

    /* ── Shared inputs ── */
    label.lbl {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      padding: 11px 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    input:focus, select:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(74,184,255,0.08);
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button { display: none; }

    .btn {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none; border-radius: 8px;
      color: #050a0f;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      padding: 11px 20px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.full { width: 100%; padding: 13px; }
    .btn.sm { font-size: 0.75rem; padding: 6px 12px; border-radius: 6px; }
    .btn.danger { background: linear-gradient(135deg, #991122, var(--error)); }
    .btn.warn   { background: linear-gradient(135deg, #996600, var(--warn)); }

    .status-msg { font-size: 0.78rem; margin-top: 10px; min-height: 18px; }
    .status-msg.error   { color: var(--error); }
    .status-msg.success { color: var(--success); }

    /* ── Dashboard ── */
    #dashboard { display: none; }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent);
    }
    .topbar-right { display: flex; gap: 12px; align-items: center; }
    .topbar-user { font-size: 0.72rem; color: var(--muted); }

    .main { padding: 32px; max-width: 1100px; margin: 0 auto; }

    /* Stats row */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 2rem;
      color: var(--accent);
    }
    .stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.1em; text-transform: uppercase; }

    /* Generate panel */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .panel-title {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 18px;
      color: var(--text);
    }
    .gen-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .gen-row > div { flex: 1; min-width: 120px; }
    .gen-row .btn { flex-shrink: 0; margin-bottom: 16px; }

    /* Generated keys output */
    .generated-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.82rem;
      color: var(--success);
      line-height: 1.9;
      margin-top: 14px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    .copy-hint { font-size: 0.7rem; color: var(--muted); margin-top: 6px; }

    /* Keys table */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(26,45,66,0.5);
      vertical-align: middle;
    }
    tr:hover td { background: rgba(74,184,255,0.03); }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
    }
    .badge.used    { background: rgba(255,85,102,0.15); color: var(--error); }
    .badge.unused  { background: rgba(68,255,170,0.12); color: var(--success); }
    .key-text { letter-spacing: 0.08em; font-size: 0.82rem; }
    .actions { display: flex; gap: 6px; }

    .search-bar { margin-bottom: 16px; }

    .filter-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--accent2);
      border-color: var(--accent2);
      color: white;
    }
    .tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    .empty { text-align: center; color: var(--muted); padding: 40px; font-size: 0.82rem; }
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr; }
      .main { padding: 16px; }
      .topbar { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-title">Rainy.solutions</div>
    <div class="login-sub">Admin Panel · Restricted Access</div>
    <label class="lbl" for="pwInput">Password</label>
    <input type="password" id="pwInput" placeholder="Enter admin password" />
    <button class="btn full" onclick="login()">Sign In</button>
    <div class="status-msg" id="loginStatus"></div>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-brand">Rainy.solutions Admin</div>
    <div class="topbar-right">
      <span class="topbar-user">Signed in as admin</span>
      <button class="btn sm" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-label">Total Keys</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statUsed">—</div>
        <div class="stat-label">Used</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statUnused">—</div>
        <div class="stat-label">Available</div>
      </div>
    </div>

    <!-- Generate panel -->
    <div class="panel">
      <div class="panel-title">Generate Keys</div>
      <div class="gen-row">
        <div>
          <label class="lbl" for="genCount">Quantity</label>
          <input type="number" id="genCount" value="1" min="1" max="100" placeholder="1"/>
        </div>
        <div style="flex:2">
          <label class="lbl" for="genLabel">Label (optional)</label>
          <input type="text" id="genLabel" placeholder="e.g. Discord giveaway"/>
        </div>
        <button class="btn" onclick="generateKeys()">Generate</button>
      </div>
      <div class="generated-box" id="generatedBox"></div>
      <div class="copy-hint" id="copyHint" style="display:none">Click a key to copy it</div>
      <div class="status-msg" id="genStatus"></div>
    </div>

    <!-- Keys table -->
    <div class="panel">
      <div class="panel-title">All Keys</div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search keys or labels…" oninput="renderTable()"/>
      </div>
      <div class="filter-tabs">
        <button class="tab active" data-filter="all" onclick="setFilter('all',this)">All</button>
        <button class="tab" data-filter="unused" onclick="setFilter('unused',this)">Available</button>
        <button class="tab" data-filter="used" onclick="setFilter('used',this)">Used</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Key</th>
              <th>Label</th>
              <th>Status</th>
              <th>Created</th>
              <th>Used At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="keysBody"></tbody>
        </table>
        <div class="empty" id="emptyMsg" style="display:none">No keys found.</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  // IMPORTANT: Replace this with your Railway backend URL after deploying
  const API_BASE = 'http://rainy-backend1-production.up.railway.app/;

  let adminToken = sessionStorage.getItem('adminToken') || '';
  let allKeys = [];
  let currentFilter = 'all';

  // Auto-login if token stored
  if (adminToken) showDashboard();

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function login() {
    const pw = document.getElementById('pwInput').value;
    const status = document.getElementById('loginStatus');
    if (!pw) { setMsg(status, 'Enter your password.', 'error'); return; }

    try {
      const res = await fetch(`${API_BASE}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const data = await res.json();
      if (!res.ok) { setMsg(status, data.error || 'Login failed.', 'error'); return; }
      adminToken = data.token;
      sessionStorage.setItem('adminToken', adminToken);
      showDashboard();
    } catch {
      setMsg(status, 'Could not connect to server.', 'error');
    }
  }

  function logout() {
    adminToken = '';
    sessionStorage.removeItem('adminToken');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadKeys();
  }

  document.getElementById('pwInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // ── Keys ──────────────────────────────────────────────────────────────────
  async function loadKeys() {
    try {
      const res = await fetch(`${API_BASE}/api/admin/keys`, {
        headers: { 'x-admin-token': adminToken }
      });
      if (res.status === 401) { logout(); return; }
      const data = await res.json();
      allKeys = data.keys || [];
      updateStats();
      renderTable();
    } catch {
      console.error('Failed to load keys');
    }
  }

  function updateStats() {
    const used = allKeys.filter(k => k.used).length;
    document.getElementById('statTotal').textContent = allKeys.length;
    document.getElementById('statUsed').textContent = used;
    document.getElementById('statUnused').textContent = allKeys.length - used;
  }

  async function generateKeys() {
    const count = parseInt(document.getElementById('genCount').value) || 1;
    const label = document.getElementById('genLabel').value.trim();
    const status = document.getElementById('genStatus');
    const box = document.getElementById('generatedBox');
    const hint = document.getElementById('copyHint');

    try {
      const res = await fetch(`${API_BASE}/api/admin/keys/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken },
        body: JSON.stringify({ count, label })
      });
      const data = await res.json();
      if (!res.ok) { setMsg(status, data.error, 'error'); return; }

      box.style.display = 'block';
      hint.style.display = 'block';
      box.innerHTML = '';
      data.generated.forEach(k => {
        const span = document.createElement('span');
        span.textContent = k.key;
        span.style.cursor = 'pointer';
        span.style.display = 'block';
        span.title = 'Click to copy';
        span.onclick = () => {
          navigator.clipboard.writeText(k.key);
          span.style.color = '#ffffff';
          setTimeout(() => span.style.color = '', 800);
        };
        box.appendChild(span);
      });

      setMsg(status, `✓ Generated ${data.generated.length} key(s).`, 'success');
      await loadKeys();
    } catch {
      setMsg(status, 'Failed to generate keys.', 'error');
    }
  }

  async function deleteKey(key) {
    if (!confirm(`Delete key ${key}?`)) return;
    await fetch(`${API_BASE}/api/admin/keys/${key}`, {
      method: 'DELETE',
      headers: { 'x-admin-token': adminToken }
    });
    await loadKeys();
  }

  async function resetKey(key) {
    await fetch(`${API_BASE}/api/admin/keys/${key}/reset`, {
      method: 'PATCH',
      headers: { 'x-admin-token': adminToken }
    });
    await loadKeys();
  }

  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderTable();
  }

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    let filtered = allKeys.filter(k => {
      const matchFilter = currentFilter === 'all' ||
        (currentFilter === 'used' && k.used) ||
        (currentFilter === 'unused' && !k.used);
      const matchSearch = k.key.toLowerCase().includes(search) ||
        (k.label || '').toLowerCase().includes(search);
      return matchFilter && matchSearch;
    });

    // Sort: unused first, then by created date desc
    filtered.sort((a, b) => {
      if (a.used !== b.used) return a.used ? 1 : -1;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });

    const tbody = document.getElementById('keysBody');
    const empty = document.getElementById('emptyMsg');

    if (!filtered.length) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }

    empty.style.display = 'none';
    tbody.innerHTML = filtered.map(k => `
      <tr>
        <td class="key-text">${k.key}</td>
        <td style="color:var(--muted)">${k.label || '—'}</td>
        <td><span class="badge ${k.used ? 'used' : 'unused'}">${k.used ? 'Used' : 'Available'}</span></td>
        <td style="color:var(--muted);font-size:0.75rem">${fmtDate(k.createdAt)}</td>
        <td style="color:var(--muted);font-size:0.75rem">${k.usedAt ? fmtDate(k.usedAt) : '—'}</td>
        <td>
          <div class="actions">
            ${k.used ? `<button class="btn sm warn" onclick="resetKey('${k.key}')">Reset</button>` : ''}
            <button class="btn sm danger" onclick="deleteKey('${k.key}')">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function setMsg(el, msg, type) {
    el.textContent = msg;
    el.className = `status-msg ${type}`;
  }
</script>
</body>
</html>
<script>
// ── HWID Panel additions ──────────────────────────────────────────────────────
// This script patches in HWID management after the page loads
document.addEventListener('DOMContentLoaded', function() {
  const orig = window.showDashboard;
  window.showDashboard = function() {
    orig && orig();
    loadHWIDs();
  };
});

let allHWIDs = [];

async function loadHWIDs() {
  try {
    const res = await fetch(`${API_BASE}/api/admin/hwids`, {
      headers: { 'x-admin-token': adminToken }
    });
    if (!res.ok) return;
    const data = await res.json();
    allHWIDs = data.hwids || [];
    renderHWIDPanel();
  } catch {}
}

function renderHWIDPanel() {
  // Remove old panel if exists
  const old = document.getElementById('hwidPanel');
  if (old) old.remove();

  const main = document.querySelector('.main');
  if (!main) return;

  const panel = document.createElement('div');
  panel.id = 'hwidPanel';
  panel.className = 'panel';
  panel.style.marginTop = '0';

  panel.innerHTML = `
    <div class="panel-title">Banned HWIDs</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>HWID</th>
            <th>Reason</th>
            <th>Banned At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="hwidsBody">
          ${allHWIDs.length === 0 ? '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px">No banned HWIDs</td></tr>' :
            allHWIDs.map(h => `
              <tr>
                <td style="font-size:0.72rem;color:var(--muted)">${h.hwid.substring(0,20)}...</td>
                <td style="font-size:0.78rem">${h.reason || '—'}</td>
                <td style="font-size:0.75rem;color:var(--muted)">${new Date(h.banned_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</td>
                <td><button class="btn sm" style="background:linear-gradient(135deg,#44ffaa,#00cc77);color:#050a0f" onclick="unbanHWID('${h.hwid}')">Unban</button></td>
              </tr>
            `).join('')}
        </tbody>
      </table>
    </div>
  `;
  main.appendChild(panel);
}

async function unbanHWID(hwid) {
  if (!confirm('Unban this HWID?')) return;
  try {
    await fetch(`${API_BASE}/api/admin/hwids/${hwid}`, {
      method: 'DELETE',
      headers: { 'x-admin-token': adminToken }
    });
    await loadHWIDs();
  } catch {}
}
</script>
