<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comefly.project/8x</title>
  <style>
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #121212;
      overflow: auto;
      scroll-behavior: smooth;
    }

    body {
      width: 100vw;
      min-width: 100vw;
      height: 160vh;
      min-height: 160vh;
      margin: 0;
      cursor: default;
      touch-action: pan-y;
      isolation: isolate;
    }

    .page-background {
      position: fixed;
      z-index: -1;
      inset: -16px;
      background: #121212 url("assets/laptop-wallpaper-dark.jpeg") center / cover no-repeat;
      filter: blur(9px);
      pointer-events: none;
    }

    body.hello-glitch { animation: hello-glitch 95ms steps(2, end) 32; }
    @keyframes hello-glitch {
      0% { transform: translate(0, 0) skew(0deg); filter: none; }
      25% { transform: translate(-10px, 6px) skew(-1.8deg); filter: contrast(1.18) saturate(1.35); }
      50% { transform: translate(12px, -7px) skew(2deg); filter: hue-rotate(16deg) contrast(1.25); }
      75% { transform: translate(-7px, -10px) skew(-1deg); filter: contrast(1.12) saturate(1.4); }
      100% { transform: translate(0, 0) skew(0deg); filter: none; }
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 160vh;
      background: transparent;
      transition: filter 100ms ease;
    }


    .profile-card {
      position: absolute;
      z-index: 1;
      top: 50vh;
      left: 50vw;
      width: min(520px, calc(100vw - 48px));
      min-height: 250px;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      transform: translate(-50%, -50%) perspective(620px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transition: transform 85ms ease-out, background 180ms ease, box-shadow 180ms ease, filter 100ms ease;
      transform-style: preserve-3d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      box-sizing: border-box;
      isolation: isolate;
      padding: 7.5rem 2rem 1.5rem;
      color: #111;
      text-align: center;
      border: 1px solid rgba(0, 0, 0, 0.24);
      border-radius: 0.75rem;
      background:
        linear-gradient(rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.035)),
        radial-gradient(circle at 50% 50%, rgba(246, 250, 255, 0.13), rgba(89, 120, 170, 0.025));
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.36),
        0 0 9px rgba(0, 0, 0, 0.42),
        0 0 22px rgba(0, 0, 0, 0.20),
        0 0 40px rgba(255, 255, 255, 0.34),
        0 18px 48px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(4px);
    }

    .profile-card:hover {
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.58),
        0 0 14px rgba(0, 0, 0, 0.55),
        0 0 56px rgba(255, 255, 255, 0.50),
        0 0 105px rgba(255, 255, 255, 0.22),
        0 18px 48px rgba(0, 0, 0, 0.35);
    }

    .profile-name {
      margin: -0.35rem 0 0;
      font: 700 1.25rem / 1.25 Inter, Arial, sans-serif;
      letter-spacing: 0;
      color: #fff;
      text-shadow: 0 0 7px rgba(255, 255, 255, 0.95), 0 0 18px rgba(255, 255, 255, 0.78), 0 0 34px rgba(184, 159, 255, 0.55);
    }

    .name-content { position: relative; display: inline-block; min-width: 1.6em; }
    .typing-cursor {
      display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -0.1em;
      background: #fff; box-shadow: 0 0 7px #fff, 0 0 14px rgba(205, 187, 255, 0.9);
      animation: blink 0.72s steps(1, end) infinite;
    }
    .star {
      position: absolute; color: #cbb6ff; font: 0.6rem / 1 Arial, sans-serif;
      text-shadow: 0 0 5px #b997ff, 0 0 11px #e5dcff;
      animation: twinkle 1.6s ease-in-out infinite alternate;
    }
    .star-one { top: -0.65rem; left: 0.9rem; }
    .star-two { top: 0.7rem; right: -0.55rem; font-size: 0.42rem; animation-delay: 0.5s; }
    .star-three { top: -0.3rem; right: -0.95rem; font-size: 0.35rem; animation-delay: 1s; }
    .star-four { top: -0.48rem; left: -0.55rem; font-size: 0.34rem; animation-delay: 0.2s; }
    .star-five { top: 0.82rem; left: 0.15rem; font-size: 0.30rem; animation-delay: 0.9s; }
    .star-six { top: -0.85rem; left: 1.75rem; font-size: 0.42rem; animation-delay: 1.2s; }
    .star-seven { top: 0.34rem; left: 1.42rem; font-size: 0.28rem; animation-delay: 0.65s; }
    .star-eight { top: -0.08rem; right: -0.42rem; font-size: 0.30rem; animation-delay: 1.4s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes twinkle {
      from { opacity: 0.35; transform: scale(0.7) rotate(0deg); }
      to { opacity: 1; transform: scale(1.2) rotate(20deg); }
    }

    .profile-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      margin-top: 1.35rem;
    }

    .profile-uid {
      position: absolute;
      top: 1rem;
      left: 1rem;
      display: inline-flex;
      align-items: center;
      padding: 0.32rem 0.5rem;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 999px;
      background: rgba(255,255,255,0.13);
      box-shadow: 0 0 8px rgba(255,255,255,0.25);
      font: 700 0.65rem / 1 Inter, Arial, sans-serif;
      letter-spacing: 0.08em;
      text-shadow: 0 0 5px rgba(255,255,255,0.9);
    }

    .project-badge {
      position: fixed;
      z-index: 20;
      right: 1rem;
      bottom: 1rem;
      font-size: 0.76rem;
      padding: 0.42rem 0.66rem;
    }
    .project-badge .heart { margin-right: 0.36rem; color: #fff; font-size: 1.65em; line-height: 0.55; }
    .profile-bio { margin: 0.5rem 0 0; color: #fff; font: 500 0.76rem / 1.3 Inter, Arial, sans-serif; text-shadow: 0 0 8px rgba(255,255,255,0.78); }
    .privacy-pill {
      position: absolute;
      top: 0.78rem;
      right: 0.78rem;
      width: min(10.3rem, 35%);
      padding: 0.42rem 0.52rem;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.56);
      border-radius: 0.62rem;
      background: rgba(16, 27, 48, 0.28);
      box-shadow: 0 0 9px rgba(255,255,255,0.2);
      font: 700 0.57rem / 1.3 Inter, Arial, sans-serif;
      text-align: left;
      text-shadow: 0 0 5px rgba(255,255,255,0.75);
    }
    .privacy-title { display: flex; align-items: center; gap: 0.3rem; letter-spacing: 0.06em; }
    .privacy-dot { width: 0.38rem; height: 0.38rem; border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff; }
    .privacy-details { display: none; margin-top: 0.35rem; color: rgba(255,255,255,0.88); font-weight: 500; letter-spacing: 0; overflow-wrap: anywhere; }
    .privacy-pill.is-ready .privacy-details { display: block; }
    .role-badges, .tech-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.38rem; }
    .role-badges { margin-top: 0.9rem; }
    .tech-badges { margin-top: 0.5rem; }
    .role-badge, .tech-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      padding: 0.32rem 0.5rem;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 999px;
      background: rgba(255,255,255,0.13);
      box-shadow: 0 0 8px rgba(255,255,255,0.25);
      font: 700 0.61rem / 1 Inter, Arial, sans-serif;
      text-shadow: 0 0 5px rgba(255,255,255,0.9);
    }
    .role-badge svg { width: 0.78rem; height: 0.78rem; fill: currentColor; }
    .tech-badge {
      color: #f3efff;
      border-color: rgba(208,191,255,0.82);
      background: rgba(185,161,255,0.18);
      box-shadow: 0 0 8px rgba(255,255,255,0.32);
      text-shadow: 0 1px 2px rgba(18, 31, 57, 0.72), 0 0 5px rgba(255,255,255,0.82);
    }

    .profile-link {
      display: grid;
      width: 1.75rem;
      height: 1.75rem;
      place-items: center;
      padding: 0;
      color: rgba(255, 255, 255, 0.82);
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
      transition: transform 140ms ease, color 140ms ease, filter 140ms ease;
    }

    .profile-link:hover, .profile-link:focus-visible {
      color: #fff;
      outline: none;
      transform: translateY(-2px) scale(1.12);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 1)) drop-shadow(0 0 13px rgba(202, 177, 255, 0.9));
    }

    .profile-link svg { width: 1.25rem; height: 1.25rem; fill: currentColor; }
    .monero-logo { width: 1.25rem; height: 1.25rem; border-radius: 50%; object-fit: cover; }

    .music-player {
      position: absolute;
      z-index: 2;
      top: 1.25rem;
      right: auto;
      left: calc(100vw - 18.5rem);
      display: grid;
      grid-template-columns: 2.8rem minmax(150px, 210px);
      gap: 0.55rem;
      align-items: center;
      padding: 0;
      color: #fff;
      transition: filter 100ms ease;
    }

    .side-video {
      position: absolute;
      z-index: 1;
      top: 50vh;
      width: min(520px, 38vw);
      height: 250px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.42), 0 12px 32px rgba(31, 47, 77, 0.20);
      transition: filter 100ms ease;
    }
    .side-video.left { top: 88vh; left: 4vw; }
    .side-video.right { top: 88vh; left: auto; right: 4vw; }
    .side-video video { display: block; width: 100%; height: 100%; object-fit: cover; }

    .pnl-card {
      position: absolute;
      z-index: 1;
      top: 18vh;
      width: clamp(11rem, 23vw, 21rem);
      border: 1px solid rgba(255, 255, 255, 0.52);
      border-radius: 0.75rem;
      padding: 0;
      overflow: hidden;
      background: rgba(41, 65, 106, 0.30);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.32), 0 16px 38px rgba(28, 45, 76, 0.30);
    }
    .pnl-card.left { left: 2vw; }
    .pnl-card.right { right: 2vw; }

    .interactive-media {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      transform: perspective(620px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      cursor: default;
      transition: transform 85ms ease-out, filter 220ms ease;
    }
    .interactive-media > img, .interactive-media > video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: opacity 260ms ease;
    }

    .surprise-actions {
      position: absolute;
      z-index: 2;
      top: calc(88vh + 125px);
      left: 50vw;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transform: translate(-50%, -50%);
    }
    .surprise-button {
      padding: 0.7rem 0.9rem;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 0.55rem;
      background: rgba(41, 65, 106, 0.36);
      box-shadow: 0 0 12px rgba(255,255,255,0.55), 0 0 24px rgba(188,169,255,0.34);
      cursor: pointer;
      font: 700 0.7rem / 1 Inter, Arial, sans-serif;
      letter-spacing: 0.08em;
      text-shadow: 0 0 7px rgba(255,255,255,0.9);
      transition: transform 140ms ease, background 140ms ease;
    }
    .surprise-button:hover, .surprise-button:focus-visible { transform: translateY(-2px) scale(1.05); background: rgba(61, 92, 143, 0.56); outline: none; }
    .surprise-button.question { width: 2.15rem; padding: 0.7rem 0; font-size: 0.9rem; }

    .album-disc {
      width: 2.8rem;
      height: 2.8rem;
      overflow: hidden;
      border: 3px solid #191919;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.66), 0 0 14px rgba(255, 255, 255, 0.72);
    }

    .album-disc img { width: 100%; height: 100%; object-fit: cover; }
    .album-disc.is-playing { animation: spin 3.2s linear infinite; }
    .music-info { min-width: 0; }
    .music-title { overflow: hidden; font: 700 0.82rem / 1.2 Inter, Arial, sans-serif; text-overflow: ellipsis; text-shadow: 0 0 8px rgba(255,255,255,0.8); white-space: nowrap; }
    .music-subtitle { margin-top: 0.18rem; color: rgba(255,255,255,0.72); font: 0.68rem / 1.2 Inter, Arial, sans-serif; }
    .music-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.55rem; }
    .play-toggle { width: 1.55rem; height: 1.55rem; padding: 0; color: #162542; border: 0; border-radius: 50%; background: #fff; cursor: pointer; }
    .play-toggle:hover { box-shadow: 0 0 11px #fff; }
    .progress { width: 100%; height: 3px; accent-color: #fff; cursor: pointer; }
    .elapsed { min-width: 2.45rem; color: rgba(255,255,255,0.85); font: 0.64rem / 1 Inter, Arial, sans-serif; text-align: right; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .view-gate {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(183, 202, 232, 0.30);
      backdrop-filter: blur(13px);
      transition: opacity 400ms ease, visibility 400ms ease;
    }

    .view-gate.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .view-gate-content { display: grid; gap: 0.65rem; place-items: center; }
    .view-notice { max-width: 21rem; margin: 0; color: rgba(255,255,255,0.86); font: 500 0.66rem / 1.35 Inter, Arial, sans-serif; text-align: center; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
    .view-button {
      padding: 1rem 1.5rem;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.10);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.65), 0 0 38px rgba(197, 174, 255, 0.38);
      cursor: pointer;
      font: 700 0.82rem / 1 Inter, Arial, sans-serif;
      letter-spacing: 0.18em;
      text-shadow: 0 0 9px rgba(255, 255, 255, 0.9);
      transition: transform 160ms ease, background 160ms ease;
    }
    .view-button:hover, .view-button:focus-visible { transform: scale(1.06); background: rgba(255, 255, 255, 0.20); outline: none; }

    .mini-terminal {
      position: absolute;
      z-index: 3;
      top: calc(50vh - 350px);
      left: 50%;
      width: min(520px, calc(100vw - 48px));
      height: 158px;
      box-sizing: border-box;
      overflow: hidden;
      transform: translateX(-50%);
      color: #e9f5ff;
      border: 1px solid rgba(255,255,255,0.58);
      border-radius: 0.75rem;
      background: rgba(21, 35, 60, 0.74);
      box-shadow: 0 0 18px rgba(255,255,255,0.36), 0 12px 30px rgba(25, 43, 75, 0.26);
      backdrop-filter: blur(8px);
      font: 0.7rem / 1.35 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    .terminal-bar { display: flex; align-items: center; height: 1.8rem; padding: 0 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.76); font: 700 0.6rem / 1 Inter, Arial, sans-serif; letter-spacing: 0.09em; }
    .terminal-lights { display: flex; gap: 0.25rem; margin-right: 0.52rem; }
    .terminal-lights i { width: 0.42rem; height: 0.42rem; border-radius: 50%; background: rgba(255,255,255,0.78); }
    .terminal-output { height: 91px; padding: 0.5rem 0.7rem 0; overflow-y: auto; white-space: pre-wrap; scrollbar-width: thin; }
    .terminal-line { min-height: 1.35em; }
    .terminal-prompt { color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.75); }
    .terminal-form { display: flex; align-items: center; padding: 0 0.7rem 0.55rem; }
    .terminal-input { width: 100%; min-width: 0; padding: 0; color: #fff; border: 0; outline: 0; background: transparent; font: inherit; caret-color: #fff; }
    .site-meta { position: fixed; z-index: 20; bottom: 1rem; left: 1rem; display: flex; gap: 0.38rem; }
    .status-indicator, .visitor-counter { display: inline-flex; align-items: center; padding: 0.32rem 0.5rem; color: #fff; border: 1px solid rgba(255,255,255,0.5); border-radius: 999px; background: rgba(255,255,255,0.13); box-shadow: 0 0 8px rgba(255,255,255,0.25); font: 700 0.61rem / 1 Inter, Arial, sans-serif; letter-spacing: 0.06em; text-shadow: 0 0 5px rgba(255,255,255,0.9); }
    .status-dot { width: 0.45rem; height: 0.45rem; margin-right: 0.34rem; border-radius: 50%; background: #fff; box-shadow: 0 0 7px #fff; animation: status-pulse 1.5s ease-in-out infinite; }
    @keyframes status-pulse { 50% { opacity: 0.45; transform: scale(0.72); } }

    @media (max-width: 560px) {
      .music-player { top: auto; right: auto; bottom: 1rem; left: 50vw; transform: translateX(-50%); }
      .mini-terminal { top: 2rem; }
      .site-meta { bottom: 4.5rem; }
    }

    .profile-avatar {
      position: absolute;
      top: 1.5rem;
      left: 50%;
      width: 5rem;
      height: 5rem;
      transform: translateX(-50%);
      object-fit: cover;
      border: 1px solid rgba(0, 0, 0, 0.45);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.38), 0 0 26px rgba(255, 255, 255, 0.85), 0 0 52px rgba(187, 210, 255, 0.72), 0 0 82px rgba(255, 255, 255, 0.36);
    }

    .live-lyrics {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: min(10.5rem, 33%);
      color: #090909;
      font: 700 0.66rem / 1.35 Inter, Arial, sans-serif;
      text-align: right;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.95), 0 0 9px rgba(255, 255, 255, 0.82);
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
    }
    .live-lyrics.is-visible { opacity: 1; }

  </style>
</head>
<body>
  <div class="page-background" aria-hidden="true"></div>
  <canvas id="network" aria-label="Animated white dots connected by lines"></canvas>
  <section class="mini-terminal" aria-label="Interactive command terminal">
    <div class="terminal-bar"><span class="terminal-lights" aria-hidden="true"><i></i><i></i><i></i></span>visitor@comefly:~</div>
    <div class="terminal-output" id="terminal-output" aria-live="polite"><div class="terminal-line">Welcome. Type <span class="terminal-prompt">help</span> to see available commands.</div></div>
    <form class="terminal-form" id="terminal-form"><span class="terminal-prompt">visitor@comefly:~$&nbsp;</span><input class="terminal-input" id="terminal-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command"></form>
  </section>
  <div class="pnl-card left interactive-media"><img src="assets/trump-pnl-card.png" alt="TRUMP profit and loss card"></div>
  <div class="pnl-card right interactive-media"><img src="assets/love-pnl-card.png" alt="LOVE profit and loss card"></div>
  <div class="side-video left interactive-media"><video autoplay muted loop playsinline src="assets/left-video.mov"></video></div>
  <div class="side-video right interactive-media"><video autoplay muted loop playsinline src="assets/right-video.mov"></video></div>
  <div class="surprise-actions"><button class="surprise-button" id="surprise-button" type="button">SURPRISE ME</button><button class="surprise-button question" id="about-button" type="button" aria-label="Search Linus Torvalds">?</button></div>
  <div class="view-gate" id="view-gate"><div class="view-gate-content"><button class="view-button" id="view-button" type="button">CLICK TO VIEW</button><p class="view-notice">Welcome to the club</p></div></div>
  <main class="profile-card" aria-label="8x profile">
    <span class="profile-uid">UID 1</span>
    <aside class="privacy-pill" id="privacy-pill" aria-live="polite"><div class="privacy-title"><span class="privacy-dot" aria-hidden="true"></span>USE A VPN!</div><div class="privacy-details" id="privacy-details">Loading connection details…</div></aside>
    <div class="live-lyrics" id="live-lyrics" aria-live="polite"></div>
    <img class="profile-avatar" src="assets/profile-portrait.jpeg" alt="Profile portrait">
    <h1 class="profile-name"><span class="name-content"><span id="typed-name">8</span><span class="typing-cursor" aria-hidden="true"></span><span class="star star-one" aria-hidden="true">✦</span><span class="star star-two" aria-hidden="true">✦</span><span class="star star-three" aria-hidden="true">✦</span><span class="star star-four" aria-hidden="true">✦</span><span class="star star-five" aria-hidden="true">✦</span><span class="star star-six" aria-hidden="true">✦</span><span class="star star-seven" aria-hidden="true">✦</span><span class="star star-eight" aria-hidden="true">✦</span></span></h1>
    <p class="profile-bio">welcome to the club</p>
    <div class="role-badges" aria-label="Profile badges">
      <span class="role-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l4.3 4.3L12 3l4.7 7.3L21 6l-2.2 12H5.2L3 6zm3 14h12v2H6v-2z"/></svg>Owner</span>
      <span class="role-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>Pwner</span>
      <span class="role-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 4v4.4l3.1 1.9-1 1.7L11 12.5V7h2z"/></svg>UID 1</span>

  <script>
    "use strict";

    const canvas = document.getElementById("network");
    const ctx = canvas.getContext("2d");
    const profileCard = document.querySelector(".profile-card");
    const typedName = document.getElementById("typed-name");
    const moneroButton = document.getElementById("monero-button");
    const audio = document.getElementById("audio");
    const playToggle = document.getElementById("play-toggle");
    const progress = document.getElementById("progress");
    const elapsed = document.getElementById("elapsed");
    const albumDisc = document.getElementById("album-disc");
    const liveLyrics = document.getElementById("live-lyrics");
    const viewGate = document.getElementById("view-gate");
    const viewButton = document.getElementById("view-button");
    const surpriseButton = document.getElementById("surprise-button");
    const aboutButton = document.getElementById("about-button");
    const privacyPill = document.getElementById("privacy-pill");
    const privacyDetails = document.getElementById("privacy-details");
    const terminal = document.querySelector(".mini-terminal");
    const terminalForm = document.getElementById("terminal-form");
    const terminalInput = document.getElementById("terminal-input");
    const terminalOutput = document.getElementById("terminal-output");
    const visitorCount = document.getElementById("visitor-count");
    const terminalHistory = [];
    let historyPosition = 0;
    let terminalDirectory = "/home/visitor";
    const dots = [];
    const snowflakes = [];
    const dotCount = 90;
    const snowCount = 100;
    const maxDistance = 150;
    const trail = Array.from({ length: 5 }, () => ({ x: 0, y: 0 }));
    let mouseX = 0;
    let mouseY = 0;
    let pointerX = 0;
    let pointerY = 0;
    let lastMoveTime = 0;

    function getBrowserName() {
      const agent = navigator.userAgent;
      if (/Edg\//.test(agent)) return "Microsoft Edge";
      if (/Firefox\//.test(agent)) return "Firefox";
      if (/Chrome\//.test(agent)) return "Chrome";
      if (/Safari\//.test(agent)) return "Safari";
      return "Unknown browser";
    }

    function getOperatingSystem() {
      const agent = navigator.userAgent;
      if (/Windows/.test(agent)) return "Windows";
      if (/Android/.test(agent)) return "Android";
      if (/iPhone|iPad|iPod/.test(agent)) return "iOS";
      if (/Mac OS X/.test(agent)) return "macOS";
      if (/Linux/.test(agent)) return "Linux";
      return "Unknown OS";
    }

    async function showConnectionDetails() {
      privacyPill.classList.add("is-ready");
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const details = [
        "IP: loading…",
        "Browser: " + getBrowserName(),
        "OS: " + getOperatingSystem(),
        "Language: " + (navigator.language || "unknown"),
        "Timezone: " + (Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown"),
        "Screen: " + screen.width + "×" + screen.height,
        "Network: " + (connection?.effectiveType || "unknown")
      ];
      privacyDetails.textContent = details.join("\n");
      try {
        const response = await fetch("https://api.ipify.org?format=json", { cache: "no-store" });
        if (!response.ok) throw new Error("IP lookup failed");
        const { ip } = await response.json();
        details[0] = "IP: " + (ip || "unavailable");
      } catch {
        details[0] = "IP: unavailable";
      }
      privacyDetails.textContent = details.join("\n");
    }

    function terminalLine(text, className = "") {
      const line = document.createElement("div");
      line.className = `terminal-line ${className}`;
      line.textContent = text;
      terminalOutput.append(line);
      terminalOutput.scrollTop = terminalOutput.scrollHeight;
    }

    function terminalPrompt() {
      return `visitor@comefly:${terminalDirectory === "/home/visitor" ? "~" : terminalDirectory}$`;
    }

    function runTerminalCommand(rawCommand) {
      const command = rawCommand.trim();
      if (!command) return;
      terminalLine(`${terminalPrompt()} ${command}`, "terminal-prompt");
      terminalHistory.push(command);
      historyPosition = terminalHistory.length;
      const [verb = "", ...argumentsList] = command.split(/\s+/);
      const argument = argumentsList.join(" ");
      const lowerVerb = verb.toLowerCase();

      if (lowerVerb === "clear" || lowerVerb === "cls") {
        terminalOutput.replaceChildren();
        return;
      }
      if (lowerVerb === "help") {
        terminalLine("Linux: ls, pwd, cd, cat, echo, whoami, uname, date, uptime, clear");
        terminalLine("Windows: dir, type, ver, systeminfo, ipconfig, cls");
        terminalLine("Extras: hello, neofetch, hostname, history");
        return;
      }
      if (lowerVerb === "hello") {
        terminalLine("hello, visitor.");
        document.body.classList.remove("hello-glitch");
        void document.body.offsetWidth;
        document.body.classList.add("hello-glitch");
        window.setTimeout(() => document.body.classList.remove("hello-glitch"), 3000);
        return;
      }
      if (lowerVerb === "ls" || lowerVerb === "dir") {
        terminalLine(terminalDirectory === "/home/visitor" ? "about.txt  projects/  skills.txt" : "connected-dots/  readme.md");
        return;
      }
      if (lowerVerb === "pwd") { terminalLine(terminalDirectory); return; }
      if (lowerVerb === "cd") {
        const destinations = { "~": "/home/visitor", "/home/visitor": "/home/visitor", "projects": "/home/visitor/projects", "/home/visitor/projects": "/home/visitor/projects", "..": "/home/visitor" };
        if (!argument || argument === "~") terminalDirectory = "/home/visitor";
        else if (destinations[argument]) terminalDirectory = destinations[argument];
        else terminalLine(`cd: no such file or directory: ${argument}`);
        return;
      }
      if (lowerVerb === "cat" || lowerVerb === "type") {
        const file = argument.toLowerCase();
        if (file === "about.txt" || file === "readme.md") terminalLine("comefly.project — building cool things, one commit at a time.");
        else if (file === "skills.txt") terminalLine("C++\nAssembly\nC#");
        else terminalLine(`${verb}: ${argument || "missing operand"}: No such file`);
        return;
      }
      if (lowerVerb === "echo") { terminalLine(argument); return; }
      if (lowerVerb === "whoami") { terminalLine("visitor"); return; }
      if (lowerVerb === "hostname") { terminalLine("comefly"); return; }
      if (lowerVerb === "uname") { terminalLine("Linux comefly 6.8.0-web #1 SMP x86_64 GNU/Linux"); return; }
      if (lowerVerb === "ver") { terminalLine("Microsoft Windows [Version 11.0.22631.0]"); return; }
      if (lowerVerb === "systeminfo") { terminalLine("Host Name: COMEFLY\nOS Name: Web Terminal\nSystem Type: x64-based browser"); return; }
      if (lowerVerb === "ipconfig" || lowerVerb === "ifconfig") { terminalLine("web0: connected\n  inet: browser-local\n  status: online"); return; }
      if (lowerVerb === "date") { terminalLine(new Date().toString()); return; }
      if (lowerVerb === "uptime") { terminalLine("up since this page was opened"); return; }
      if (lowerVerb === "neofetch") {
        terminalLine("         _-----_                 visitor@comefly\n      _-~       ~-_              ----------------\n    _~             ~_            OS: Gentoo Linux x86_64\n   /                 \\           Host: comefly.project\n  |                   |          Kernel: 6.12.12-gentoo\n   \\                 /           Uptime: this session\n    ~_             _~            Packages: 1842 (emerge)\n      ~-_       _-~              Shell: zsh 5.9\n         ~-----~                 DE/WM: Hyprland\n                                 Terminal: comefly-sh\n                                 Status: DEVING");
        return;
      }
      if (lowerVerb === "history") { terminalHistory.forEach((entry, index) => terminalLine(`${index + 1}  ${entry}`)); return; }
      terminalLine(`${verb}: command not found — type help`, "terminal-error");
    }

    terminalForm.addEventListener("submit", (event) => {
      event.preventDefault();
      runTerminalCommand(terminalInput.value);
      terminalInput.value = "";
    });
    terminalInput.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" && terminalHistory.length) {
        event.preventDefault();
        historyPosition = Math.max(0, historyPosition - 1);
        terminalInput.value = terminalHistory[historyPosition];
      }
      if (event.key === "ArrowDown" && terminalHistory.length) {
        event.preventDefault();
        historyPosition = Math.min(terminalHistory.length, historyPosition + 1);
        terminalInput.value = terminalHistory[historyPosition] || "";
      }
    });
    terminal.addEventListener("pointerdown", () => terminalInput.focus());
    const visits = Number.parseInt(localStorage.getItem("comefly-project-visits") || "0", 10) + 1;
    localStorage.setItem("comefly-project-visits", String(visits));
    visitorCount.textContent = String(visits).padStart(3, "0");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = Math.round(window.innerHeight * 1.6);
    }

    function makeDot() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8
      };
    }

    function setup() {
      resize();
      dots.length = 0;
      snowflakes.length = 0;
      for (let index = 0; index < dotCount; index += 1) dots.push(makeDot());
      for (let index = 0; index < snowCount; index += 1) {
        snowflakes.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 1.8 + 0.5, speedX: Math.random() * 0.65 + 0.25, speedY: Math.random() * 0.85 + 0.35, opacity: Math.random() * 0.52 + 0.24 });
      }
    }

    function drawPixelCursor(x, y, glitch, opacity) {
      const size = 3;
      const shape = [
        [1, 0], [1, 1], [1, 2], [1, 3], [1, 4], [1, 5], [1, 6],
        [2, 5], [3, 5], [4, 5], [5, 5], [6, 5], [3, 6], [4, 7], [5, 8]
      ];
      ctx.fillStyle = `rgba(255,255,255,${opacity})`;
      for (const [pixelX, pixelY] of shape) {
        ctx.fillRect(
          Math.round(x + pixelX * size + glitch),
          Math.round(y + pixelY * size - glitch),
          size,
          size
        );
      }
    }

    function drawCursorTrail() {
      if (performance.now() - lastMoveTime > 110) return;

      trail[0].x += (mouseX - trail[0].x) * 0.5;
      trail[0].y += (mouseY - trail[0].y) * 0.5;
      for (let index = 1; index < trail.length; index += 1) {
        trail[index].x += (trail[index - 1].x - trail[index].x) * 0.5;
        trail[index].y += (trail[index - 1].y - trail[index].y) * 0.5;
      }

      for (let index = trail.length - 1; index >= 0; index -= 1) {
        const glitch = (Math.random() - 0.5) * (index + 1) * 2;
        drawPixelCursor(trail[index].x, trail[index].y, glitch, 0.75 - index * 0.12);
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const dot of dots) {
        dot.x += dot.vx;
        dot.y += dot.vy;
        if (dot.x < 0 || dot.x > canvas.width) dot.vx *= -1;
        if (dot.y < 0 || dot.y > canvas.height) dot.vy *= -1;
      }

      for (let first = 0; first < dots.length; first += 1) {
        for (let second = first + 1; second < dots.length; second += 1) {
          const distance = Math.hypot(dots[first].x - dots[second].x, dots[first].y - dots[second].y);
          if (distance < maxDistance) {
            ctx.strokeStyle = `rgba(255,255,255,${0.72 * (1 - distance / maxDistance)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(dots[first].x, dots[first].y);
            ctx.lineTo(dots[second].x, dots[second].y);
            ctx.stroke();
          }
        }
      }

      ctx.fillStyle = "#fff";
      for (const dot of dots) {
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const snowflake of snowflakes) {
        snowflake.x += snowflake.speedX;
        snowflake.y += snowflake.speedY;
        if (snowflake.y > canvas.height + 4 || snowflake.x > canvas.width + 4) {
          snowflake.x = Math.random() * canvas.width * 0.35 - 10;
          snowflake.y = -6;
        }
        ctx.fillStyle = `rgba(255,255,255,${snowflake.opacity})`;
        ctx.beginPath();
        ctx.arc(snowflake.x, snowflake.y, snowflake.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      drawCursorTrail();
      requestAnimationFrame(animate);
    }

    window.addEventListener("mousemove", (event) => {
      pointerX = event.clientX;
      pointerY = event.clientY;
      mouseX = pointerX + window.scrollX;
      mouseY = pointerY + window.scrollY;
      lastMoveTime = performance.now();
      if (trail.every((cursor) => cursor.x === 0 && cursor.y === 0)) {
        for (const cursor of trail) {
          cursor.x = mouseX;
          cursor.y = mouseY;
        }
      }
    });

    window.addEventListener("scroll", () => {
      mouseX = pointerX + window.scrollX;
      mouseY = pointerY + window.scrollY;
      lastMoveTime = performance.now();
    }, { passive: true });

    profileCard.addEventListener("pointermove", (event) => {
      const bounds = profileCard.getBoundingClientRect();
      const relativeX = (event.clientX - bounds.left) / bounds.width - 0.5;
      const relativeY = (event.clientY - bounds.top) / bounds.height - 0.5;
      profileCard.style.setProperty("--tilt-x", `${relativeY * -18}deg`);
      profileCard.style.setProperty("--tilt-y", `${relativeX * 18}deg`);
    });

    profileCard.addEventListener("pointerleave", () => {
      profileCard.style.setProperty("--tilt-x", "0deg");
      profileCard.style.setProperty("--tilt-y", "0deg");
    });

    window.addEventListener("resize", setup);
    const typeSequence = [
      { text: "8", delay: 500 }, { text: "8x", delay: 1500 },
      { text: "8", delay: 650 }, { text: "8x", delay: 1600 }
    ];
    let typeStep = 0;
    function updateTypedName() {
      const frame = typeSequence[typeStep];
      typedName.textContent = frame.text;
      typeStep = (typeStep + 1) % typeSequence.length;
      window.setTimeout(updateTypedName, frame.delay);
    }
    moneroButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText("LOL");
      } catch {
        const helper = document.createElement("textarea");
        helper.value = "LOL";
        document.body.append(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
    });
    function formatTime(seconds) {
      const safeSeconds = Number.isFinite(seconds) ? Math.floor(seconds) : 0;
      return `${Math.floor(safeSeconds / 60)}:${String(safeSeconds % 60).padStart(2, "0")}`;
    }
    playToggle.addEventListener("click", async () => {
      if (!audio.src) return;
      if (audio.paused) await audio.play(); else audio.pause();
    });
    audio.addEventListener("play", () => { playToggle.textContent = "❚❚"; playToggle.setAttribute("aria-label", "Pause"); albumDisc.classList.add("is-playing"); });
    audio.addEventListener("pause", () => { playToggle.textContent = "▶"; playToggle.setAttribute("aria-label", "Play"); albumDisc.classList.remove("is-playing"); });
    const lyricCues = [];
    /*
      [11, 15, "Yeah, I'm out that Brooklyn, now I'm down in Tribeca"],

    */
    const lyricSpeed = 1;
    function updateLyrics(time) {
      const cue = lyricCues.find(([start, end]) => time >= start && time < end);
      const text = cue ? cue[2] : "";
      if (liveLyrics.textContent !== text) liveLyrics.textContent = text;
      liveLyrics.classList.toggle("is-visible", Boolean(text));
    }
    audio.addEventListener("timeupdate", () => { progress.value = audio.duration ? String((audio.currentTime / audio.duration) * 100) : "0"; elapsed.textContent = formatTime(audio.currentTime); updateLyrics(audio.currentTime * lyricSpeed); });
    progress.addEventListener("input", () => { if (audio.duration) audio.currentTime = (Number(progress.value) / 100) * audio.duration; });
    viewButton.addEventListener("click", async () => {
      viewGate.classList.add("is-hidden");
      showConnectionDetails();
      try { await audio.play(); } catch {}
    }, { once: true });
    surpriseButton.addEventListener("click", () => {
      const countries = ["Argentina", "Australia", "Brazil", "Canada", "Egypt", "France", "India", "Japan", "Kenya", "Mexico", "Norway", "South Korea", "Thailand", "Turkey", "Vietnam"];
      const country = countries[Math.floor(Math.random() * countries.length)];
      window.open(`https://www.google.com/search?q=${encodeURIComponent(country)}`, "_blank", "noopener,noreferrer");
    });
    aboutButton.addEventListener("click", () => {
      window.open("https://www.google.com/search?q=Linus+Torvalds", "_blank", "noopener,noreferrer");
    });
    document.querySelectorAll(".interactive-media").forEach((media) => {
      media.addEventListener("pointermove", (event) => {
        const bounds = media.getBoundingClientRect();
        const relativeX = (event.clientX - bounds.left) / bounds.width - 0.5;
        const relativeY = (event.clientY - bounds.top) / bounds.height - 0.5;
        media.style.setProperty("--tilt-x", `${relativeY * -18}deg`);
        media.style.setProperty("--tilt-y", `${relativeX * 18}deg`);
      });
      media.addEventListener("pointerleave", () => {
        media.style.setProperty("--tilt-x", "0deg");
        media.style.setProperty("--tilt-y", "0deg");
      });
    });
    setup();
    animate();
    updateTypedName();
    audio.play().catch(() => {});
  </script>
</body>
</html>
